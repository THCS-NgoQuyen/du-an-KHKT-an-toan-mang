<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Cẩm Nang Công Dân Số — Sách Điện Tử 40 Trang</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/1.png" type="image/png">
</head>
<body>
  <!-- Top Navigation & Control Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="../index.html" class="toggle-btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);color:#f1f5f9;font-weight:700;margin-right:8px;" title="Quay về Trang Chủ CyberShield">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Trang Chủ</span>
      </a>
      <div class="logo">
        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span class="app-title">CẨM NANG CÔNG DÂN SỐ</span>
      </div>
      <div class="view-mode-toggle">
        <button id="btnModeSpread" class="toggle-btn active" title="Xem 2 trang mở">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M3 5v14h8V5H3zm10 0v14h8V5h-8z"/>
          </svg>
          <span>2 Trang</span>
        </button>
        <button id="btnModeSingle" class="toggle-btn" title="Xem 1 trang đơn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M6 4h12v16H6z"/>
          </svg>
          <span>1 Trang</span>
        </button>
      </div>
    </div>

    <div class="header-center">
      <span id="pageIndicator" class="page-badge">Trang 1 / 45</span>
    </div>

    <div class="header-right">
      <!-- Auto play / Slideshow -->
      <button id="btnAutoPlay" class="control-btn" title="Tự động lật trang (Trình chiếu)">
        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        <span class="btn-label">Tự động</span>
      </button>

      <!-- Sound toggle -->
      <button id="btnSound" class="control-btn active" title="Âm thanh lật sách">
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>

      <!-- Zoom Controls -->
      <div class="zoom-group">
        <button id="btnZoomOut" class="control-btn" title="Thu nhỏ (Z -)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
        <span id="zoomLevel" class="zoom-indicator">100%</span>
        <button id="btnZoomIn" class="control-btn" title="Phóng to (Z +)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
        <button id="btnZoomReset" class="control-btn" title="Khôi phục kích thước">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>

      <!-- Thumbnail Grid Modal Toggle -->
      <button id="btnGrid" class="control-btn" title="Xem danh sách 45 trang (Mục lục ảnh)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="btn-label">Tất cả trang</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button id="btnFullscreen" class="control-btn" title="Toàn màn hình (F)">
        <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <svg class="icon-compress" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Viewport / Book Scene -->
  <main id="viewport" class="viewport">
    <!-- Prev Page Side Button -->
    <button id="btnPrevPageSide" class="side-nav-btn prev-btn" aria-label="Trang trước" title="Trang trước (Mũi tên trái)">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Book Zoom/Pan Container -->
    <div id="bookTransformContainer" class="book-transform-container">
      <div id="book" class="book">
        <!-- Center Spine shadow overlay -->
        <div class="book-spine"></div>
        <div class="book-spine-ridge"></div>

        <!-- Left Page Base (shows back face of current spread) -->
        <div id="leftBase" class="page-base left-base">
          <div class="paper-texture"></div>
          <div class="gutter-shadow"></div>
          <img id="leftBaseImg" class="base-image" alt="Trang trái" draggable="false">
          <div class="page-num-tag left-tag" id="leftBaseNum"></div>
        </div>

        <!-- Right Page Base (shows front face of current spread) -->
        <div id="rightBase" class="page-base right-base">
          <div class="paper-texture"></div>
          <div class="gutter-shadow"></div>
          <img id="rightBaseImg" class="base-image" alt="Trang phải" draggable="false">
          <div class="page-num-tag right-tag" id="rightBaseNum"></div>
        </div>

        <!-- Sheets Container for 3D Flipping -->
        <div id="sheetsContainer" class="sheets-container"></div>
      </div>
    </div>

    <!-- Next Page Side Button -->
    <button id="btnNextPageSide" class="side-nav-btn next-btn" aria-label="Trang sau" title="Trang sau (Mũi tên phải)">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <!-- Flip hint / corner curls -->
    <div id="cornerHintRight" class="corner-curl-hint corner-right" title="Bấm hoặc vuốt để lật trang tiếp"></div>
    <div id="cornerHintLeft" class="corner-curl-hint corner-left" title="Bấm hoặc vuốt để lật trang trước"></div>
  </main>

  <!-- Bottom Navigation & Scrub Bar -->
  <footer class="app-footer">
    <div class="footer-controls">
      <!-- First Page -->
      <button id="btnFirst" class="nav-btn" title="Trang đầu (Home)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>

      <!-- Prev Page -->
      <button id="btnPrev" class="nav-btn primary-nav" title="Trang trước (←)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span class="btn-text">Trang trước</span>
      </button>

      <!-- Scrub Slider & Direct Page Input -->
      <div class="page-slider-wrap">
        <input type="range" id="pageSlider" min="1" max="45" value="1" step="1">
        <div class="page-quick-jump">
          <span>Đi đến trang:</span>
          <input type="number" id="pageNumberInput" min="1" max="45" value="1">
          <span>/ 45</span>
          <button id="btnGoToPage" class="mini-btn">Đến</button>
        </div>
      </div>

      <!-- Next Page -->
      <button id="btnNext" class="nav-btn primary-nav" title="Trang sau (→)">
        <span class="btn-text">Trang sau</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <!-- Last Page -->
      <button id="btnLast" class="nav-btn" title="Trang cuối (End)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>

      <!-- Toggle Thumbnails Drawer Button -->
      <button id="btnToggleDrawer" class="nav-btn drawer-toggle" title="Thanh thu nhỏ trang">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Thu nhỏ</span>
      </button>
    </div>

    <!-- Bottom Thumbnail Carousel Drawer -->
    <div id="thumbDrawer" class="thumbnail-drawer">
      <div id="thumbList" class="thumbnail-list">
        <!-- Rendered dynamically 1 to 45 -->
      </div>
    </div>
  </footer>

  <!-- Fullscreen Grid Modal (Overview 45 Pages) -->
  <div id="gridModal" class="modal-overlay" style="display:none;">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <h3>Danh Sách Toàn Bộ 45 Trang</h3>
        </div>
        <button id="btnCloseGrid" class="modal-close" title="Đóng">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="modalGridItems" class="grid-catalog">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="flipbook.js"></script>
</body>
</html>
